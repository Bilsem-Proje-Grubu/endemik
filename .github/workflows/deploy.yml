name: GitHub Pages'e yayınla

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Birleştirme kaydından ("Merge pull request #35 ...") PR numarasını alır; yönetici Ayarlar'da gösterir.
      - name: PR numarası
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: echo "VITE_PR_NUMBER=$(printf '%s' "$MSG" | grep -oE '#[0-9]+' | head -1 | tr -d '#')" >> "$GITHUB_ENV"
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      # Site, gh-pages dalına yazılır (Settings > Pages > Deploy from a branch > gh-pages).
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
